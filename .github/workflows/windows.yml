name: Native ACP compatibility and Linux service

on:
  pull_request:
  push:
    branches: [main, pr2-integration, fix/windows-acp-compatibility]
    tags: ['v[0-9]*', 'agy-api-v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: mkdir -p /tmp/opencode
      - run: bun ci
      - run: bun run check
      - run: bun run build:service
      - name: Verify standalone service and installer
        run: |
          release_dir="$RUNNER_TEMP/agy-api-release"
          mkdir "$release_dir"
          cp dist/agy-api "$release_dir/agy-api-linux-x86_64"
          smoke_dir="$(mktemp -d)"
          (
            cd "$smoke_dir"
            env -i PATH=/nonexistent HOME="$smoke_dir" "$release_dir/agy-api-linux-x86_64" --help
            check_bind() {
              local expected_host=$1 status=0
              shift
              timeout 15s env -i PATH=/nonexistent HOME="$smoke_dir" AGY_PORT=0 \
                AGY_API_KEY=smoke-test-key-at-least-32-characters \
                OPENCODE_ANTIGRAVITY_ACP_PATH="$smoke_dir/missing-acp" "$@" \
                "$release_dir/agy-api-linux-x86_64" > startup.log 2>&1 || status=$?
              cat startup.log
              test "$status" -eq 1
              grep -Fq "agy-api listening on http://$expected_host:" startup.log
              grep -Fq 'agy-api could not prepare ACP' startup.log
            }
            check_bind 127.0.0.1
            check_bind 127.0.0.2 AGY_HOST=127.0.0.2
          )
          (
            cd "$release_dir"
            sha256sum agy-api-linux-x86_64 > agy-api-linux-x86_64.sha256
          )
          sh scripts/test-install.sh "$release_dir"
      - uses: actions/upload-artifact@v7
        with:
          name: agy-api-linux-x86_64
          path: |
            ${{ runner.temp }}/agy-api-release/agy-api-linux-x86_64
            ${{ runner.temp }}/agy-api-release/agy-api-linux-x86_64.sha256
          if-no-files-found: error
          overwrite: true
  release:
    if: >-
      github.repository == 'jeffusion/opencode-antigrvity' &&
      github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: agy-api-release-${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: agy-api-linux-x86_64
          path: ${{ runner.temp }}/agy-api-release
      - name: Verify downloaded checksum
        working-directory: ${{ runner.temp }}/agy-api-release
        run: sha256sum --check agy-api-linux-x86_64.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^(agy-api-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an installer-compatible release tag like v0.1.0."
            exit 1
          fi
          # Creation fails if this tag already has a published release.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "$RUNNER_TEMP/agy-api-release/agy-api-linux-x86_64" \
            "$RUNNER_TEMP/agy-api-release/agy-api-linux-x86_64.sha256"
  macos:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    # actions/runner-images lists macos-15 as ARM64; assert architecture in test.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: mkdir -p /tmp/opencode
      - run: bun ci
      - run: bun run compile
      - name: Download the reviewed official macOS ARM64 pair
        run: |
          directory="$RUNNER_TEMP/agy-acp-1.3.0"
          curl --fail --location 'https://dl.google.com/agy-extensions/releases/macos/agy-acp-server-1.3.0-darwin-arm64.zip' -o "$RUNNER_TEMP/agy-acp.zip"
          unzip "$RUNNER_TEMP/agy-acp.zip" -d "$directory"
          chmod +x "$directory/agy_acp_server.par" "$directory/localharness_external"
          echo "AGY_TEST_MACOS_ACP_DIR=$directory" >> "$GITHUB_ENV"
      # Linux runs the complete suite; these platform jobs also exercise the
      # portable native-lock, tombstone, atomic-write and deletion-queue cases.
      - run: bun test test/macos-support.test.ts test/windows-support.test.ts test/file-lock.test.ts test/acp-install.test.ts test/atomic-write.test.ts test/deletion-recovery.test.ts test/bounded-retry-queue.test.ts test/cli-credentials.test.ts test/auth-bridge.test.ts test/host-environment.test.ts test/acp-process.test.ts test/budget-config.test.ts test/plugin-entrypoint.test.ts test/usage-fallback.test.ts --timeout 30000
  windows:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: bun ci
      - run: bun run compile
      # Review/profile checks need no Google account and never run inference.
      - name: Download the reviewed official Windows pair
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'agy-acp-1.3.0'
          $archive = Join-Path $env:RUNNER_TEMP 'agy-acp-1.3.0.zip'
          Invoke-WebRequest 'https://dl.google.com/agy-extensions/releases/windows/agy-acp-server-1.3.0-windows-x86_64.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          "AGY_TEST_WINDOWS_ACP_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Process fixtures elsewhere use POSIX shebangs; native tests below
      # exercise Windows executables, filesystem, authentication and budgets.
      - run: bun test test/windows-support.test.ts test/file-lock.test.ts test/acp-install.test.ts test/atomic-write.test.ts test/deletion-recovery.test.ts test/bounded-retry-queue.test.ts test/cli-credentials.test.ts test/budget-config.test.ts test/plugin-entrypoint.test.ts --timeout 30000
        env:
          AGY_TEST_NATIVE_KEYRING: '1'
